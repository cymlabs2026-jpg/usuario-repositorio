# Plantilla de ontología: empresas comerciales y de distribución.
# Cada campo estándar lista los nombres de columna con que suele venir en
# los exportes de Siigo, World Office, SAP o en Excel hechos a mano.
nombre: comercial
version: 1
objetos:
  Factura:
    descripcion: Factura de venta a crédito con saldo pendiente
    campos:
      nit:               {tipo: nit,    requerido: true,  sinonimos: [nit, identificacion, nit_cliente, id_cliente, cedula_nit, nit_tercero]}
      cliente:           {tipo: texto,  requerido: true,  sinonimos: [cliente, razon_social, nombre_cliente, nombre_del_tercero, tercero, nombre]}
      numero:            {tipo: texto,  requerido: true,  sinonimos: [factura, numero_factura, no_factura, num_factura, comprobante, numero]}
      fecha_emision:     {tipo: fecha,  requerido: true,  sinonimos: [fecha, fecha_factura, fecha_emision, emision, fecha_documento]}
      fecha_vencimiento: {tipo: fecha,  requerido: true,  sinonimos: [vencimiento, fecha_vencimiento, vence, fecha_vence]}
      saldo:             {tipo: dinero, requerido: true,  sinonimos: [saldo, saldo_pendiente, por_cobrar, pendiente, saldo_actual]}
      valor:             {tipo: dinero, requerido: false, sinonimos: [valor, total, valor_factura, valor_total]}
      vendedor:          {tipo: texto,  requerido: false, sinonimos: [vendedor, asesor, comercial, ejecutivo]}
      cupo:              {tipo: dinero, requerido: false, sinonimos: [cupo, cupo_credito, limite_credito, cupo_asignado]}
  Venta:
    descripcion: Factura de venta emitida (pagada o no). Alimenta Foco comercial y el valor del cliente
    campos:
      nit:      {tipo: nit,    requerido: true,  sinonimos: [nit, identificacion, nit_cliente, id_cliente, cedula_nit, nit_tercero]}
      cliente:  {tipo: texto,  requerido: true,  sinonimos: [cliente, razon_social, nombre_cliente, nombre_del_tercero, tercero, nombre]}
      numero:   {tipo: texto,  requerido: true,  sinonimos: [factura, numero_factura, no_factura, num_factura, comprobante, numero, documento]}
      fecha:    {tipo: fecha,  requerido: true,  sinonimos: [fecha, fecha_factura, fecha_emision, fecha_documento, fecha_venta, emision]}
      valor:    {tipo: dinero, requerido: true,  sinonimos: [valor, total, valor_total, valor_factura, valor_neto, venta, subtotal]}
      vendedor: {tipo: texto,  requerido: false, sinonimos: [vendedor, asesor, comercial, ejecutivo]}
  LineaVenta:
    descripcion: Línea de factura de venta con producto y costo. Alimenta Margen
    campos:
      nit:       {tipo: nit,    requerido: true,  sinonimos: [nit, identificacion, nit_cliente, id_cliente, cedula_nit, nit_tercero]}
      cliente:   {tipo: texto,  requerido: true,  sinonimos: [cliente, razon_social, nombre_cliente, nombre_del_tercero, tercero, nombre]}
      numero:    {tipo: texto,  requerido: true,  sinonimos: [factura, numero_factura, no_factura, num_factura, comprobante, documento]}
      fecha:     {tipo: fecha,  requerido: true,  sinonimos: [fecha, fecha_factura, fecha_emision, fecha_documento, fecha_venta]}
      producto:  {tipo: texto,  requerido: true,  sinonimos: [producto, referencia, descripcion, item, articulo, nombre_producto, sku]}
      valor:     {tipo: dinero, requerido: true,  sinonimos: [valor_neto, venta_neta, valor, total, subtotal, valor_total]}
      costo:     {tipo: dinero, requerido: true,  sinonimos: [costo, costo_total, costo_venta, costo_de_venta]}
      descuento: {tipo: dinero, requerido: false, sinonimos: [descuento, valor_descuento, dcto, descuento_valor]}
      cantidad:  {tipo: numero, requerido: false, sinonimos: [cantidad, unidades, cant]}
      vendedor:  {tipo: texto,  requerido: false, sinonimos: [vendedor, asesor, comercial, ejecutivo]}
  Recaudo:
    descripcion: Pago recibido de un cliente (recibo de caja), cruzado con la factura que paga. Da la fecha real de pago
    campos:
      nit:        {tipo: nit,    requerido: true,  sinonimos: [nit, identificacion, nit_cliente, id_cliente, cedula_nit, nit_tercero]}
      cliente:    {tipo: texto,  requerido: false, sinonimos: [cliente, razon_social, nombre_cliente, nombre_del_tercero, tercero, nombre]}
      factura:    {tipo: texto,  requerido: true,  sinonimos: [factura, factura_cruce, documento_cruce, doc_cruce, numero_factura, no_factura, num_factura, cruce]}
      fecha_pago: {tipo: fecha,  requerido: true,  sinonimos: [fecha_pago, fecha_recaudo, fecha_recibo, fecha_consignacion, fecha_abono, fecha]}
      valor:      {tipo: dinero, requerido: true,  sinonimos: [valor_pagado, valor_recaudo, valor_abono, abono, pago, valor, total]}
      recibo:     {tipo: texto,  requerido: false, sinonimos: [recibo, recibo_caja, numero_recibo, no_recibo, comprobante, rc]}
  Cliente:
    descripcion: Se deriva de las facturas y las ventas, agrupando por NIT
    relaciones:
      tiene_facturas: Factura.nit
